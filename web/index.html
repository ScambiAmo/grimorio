<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grimorio Botanico</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#2f5d3a">
<style>
:root{--bg:#f4f1e8;--fg:#222;--g:#2f5d3a;--card:#fff;--red:#a4262c;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#161a16;--fg:#e8e8e0;--card:#222822;--g:#7bb98a}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;gap:.5rem;align-items:center;padding:.6rem 1rem;background:var(--g);color:#fff}header{gap:1rem}header a{color:#fff;text-decoration:none}header a:first-of-type{margin-left:auto}header b{flex:1}
main{padding:1rem;max-width:42rem;margin:auto}.c{background:var(--card);border-radius:12px;padding:.8rem 1rem;margin:.6rem 0}
button,input,select{font:inherit;padding:.6rem .9rem;border-radius:10px;border:1px solid #8884}button{background:var(--g);color:#fff;border:0}button.s{background:none;color:var(--g);border:1px solid var(--g)}
input[type=search]{width:100%;box-sizing:border-box}video,img{max-width:100%;border-radius:10px}.red{background:var(--red);color:#fff;border-radius:10px;padding:.7rem 1rem;margin:.6rem 0}.warn{background:#fff3cd;color:#533;border-radius:10px;padding:.6rem 1rem}
details{margin:.4rem 0}summary{font-weight:600;cursor:pointer}small{opacity:.75}li{margin:.25rem 0}
.doc{background:#fbfaf5;color:#1b1b1b;font:17px/1.65 Georgia,"Times New Roman",serif;padding:1.4rem 1.6rem;border-radius:6px;box-shadow:0 1px 8px #0003}
.doc h1{font-size:1.9rem;margin:.2rem 0}.doc h2{border-bottom:1px solid #8886;padding-bottom:.2rem;margin-top:2rem}.doc h3{font-size:1.05rem;margin:1rem 0 .2rem}.doc a{color:#2f5d3a}.doc .sp{break-before:page}
.badge{width:100%;height:auto}.badge.big{width:min(80vw,320px)}.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6rem}
@media print{header,.noprint{display:none}body{background:#fff}.doc{box-shadow:none;padding:0}}
</style></head><body><header><b>🌿 Grimorio</b><a href="#/archivio">Archivio</a><a href="#/g">Il mio grimorio</a></header><main id="app"></main><script type="module" src="app.js"></script></body></html>
